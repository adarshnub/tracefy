name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package GitHub release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            node -e "console.log('value=' + require('./apps/vscode-extension/package.json').version)" >> "$GITHUB_OUTPUT"
          fi

      - name: Package VSIX
        run: npm run package -w tracefy

      - name: Package Chrome bridge
        shell: bash
        run: |
          cd apps/chrome-extension
          zip -r "../../tracefy-chrome-bridge-${{ steps.version.outputs.value }}.zip" manifest.json popup.html dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "apps/vscode-extension/tracefy-${VERSION}.vsix" "tracefy-chrome-bridge-${VERSION}.zip" --clobber
          else
            gh release create "$TAG_NAME" "apps/vscode-extension/tracefy-${VERSION}.vsix" "tracefy-chrome-bridge-${VERSION}.zip" \
              --title "Tracefy ${TAG_NAME}" \
              --notes "Download the VSIX for Cursor/VS Code and the Chrome bridge zip for browser signal capture."
          fi
